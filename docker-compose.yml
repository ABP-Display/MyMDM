services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${MYMDM_DATABASE_NAME:-mymdm}
      POSTGRES_USER: ${MYMDM_DATABASE_USER:-mymdm}
      POSTGRES_PASSWORD: ${MYMDM_DATABASE_PASSWORD:-mymdm}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MYMDM_DATABASE_USER:-mymdm} -d ${MYMDM_DATABASE_NAME:-mymdm}"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      APP_NAME: MyMDM
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${MYMDM_BASE_URL:-http://localhost:8380}
      MYMDM_BASE_URL: ${MYMDM_BASE_URL:-http://localhost:8380}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${MYMDM_DATABASE_NAME:-mymdm}
      DB_USERNAME: ${MYMDM_DATABASE_USER:-mymdm}
      DB_PASSWORD: ${MYMDM_DATABASE_PASSWORD:-mymdm}
      SESSION_DRIVER: database
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      MYMDM_APK_PATH: /app/android/app/build/outputs/apk/debug/app-debug.apk
      MYMDM_ANDROID_APK_PATH: /app/android/app/build/outputs/apk/debug/app-debug.apk
    ports:
      - "8380:8080"
    volumes:
      - ./data:/data:ro
      - ./android/app/build/outputs/apk/debug:/app/android/app/build/outputs/apk/debug:ro
      - server-storage:/app/storage/app/private


volumes:
  postgres-data:
  server-storage:
