<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore the MyMDM device management console with an interactive demo and fictional Android devices.">
  <meta name="theme-color" content="#eee2ce">
  <title>MyMDM · Interactive demo</title>
  <link rel="icon" type="image/svg+xml" href="./mymdm-logo.svg">
  <link rel="stylesheet" href="./demo.css">
  <script src="./demo.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="shell">
    <button class="backdrop" aria-label="Close navigation" hidden></button>
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="#overview"><img src="./mymdm-logo.svg" width="38" height="38" alt=""><span>MyMDM<small>Device Management</small></span></a>
      <label class="organization"><span>Organization</span><select id="organization" aria-label="Organization"><option value="default">Default</option><option value="north">Northwind Retail</option><option value="campus">Westbridge Campus</option></select></label>
      <nav id="navigation" aria-label="Pages"></nav>
      <div class="sidebar-footer"><span class="demo-badge">Interactive demo</span><p>Fictional devices.<br>No account required.</p><button class="secondary reset-demo" type="button">Reset demo</button></div>
    </aside>
    <main id="content" tabindex="-1">
      <header class="topbar"><button id="menu-toggle" class="icon-button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false"></button><h1 id="page-title">Overview</h1><span class="preview-label"><i></i>Demo workspace</span></header>
      <div class="demo-notice"><span id="notice-icon"></span><p>Explore MyMDM with sample data. Changes are simulated and reset when you reload.</p></div>
      <div id="page"></div>
      <footer class="page-footer"><span>MyMDM <span class="footer-dot">·</span> Device Management</span><span>Static demo · No live devices connected</span></footer>
    </main>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><div class="noscript">Enable JavaScript to explore the interactive MyMDM demo.</div></noscript>
</body>
</html>
